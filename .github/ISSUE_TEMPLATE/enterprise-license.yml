name: GreenPR Enterprise license request
description: Request manual onboarding for GreenPR Enterprise at US$899 per organization/month.
title: "GreenPR Enterprise license request"
assignees:
  - Mbuso-Harvey
body:
  - type: markdown
    attributes:
      value: |
        **GreenPR Enterprise — US$899 per organization/month.**

        This is a public request inbox. A GitHub account is required to submit a request. GreenPR will follow up in this issue to arrange the next steps. Licensing and payment are arranged manually; submitting this request does not charge you or activate a subscription.

        Do not include email addresses, private organization or repository names, source code, credentials, card details, or other sensitive information. Share only a general use case.
  - type: textarea
    id: general-use-case
    attributes:
      label: General use case
      description: Briefly describe what you need without identifying private projects, organizations, or people.
      placeholder: Coordinating dependency updates across multiple development teams.
    validations:
      required: true
  - type: checkboxes
    id: public-request-acknowledgment
    attributes:
      label: Public request acknowledgment
      options:
        - label: I understand this issue is public, have included no sensitive information, and understand that this request does not charge me or activate a subscription.
          required: true
