name: GreenPR Security Remediation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  greenpr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64
          install_dir="$RUNNER_TEMP/greenpr-osv"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$install_dir/osv-scanner"
          printf '%s  %s\n' '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b' "$install_dir/osv-scanner" | sha256sum --check --strict
          chmod 755 "$install_dir/osv-scanner"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run GreenPR Engine
        uses: ./
        with:
          api_key: ${{ secrets.GREENPR_API_KEY || secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
