name: 'GreenPR: Isolated dependency remediation'
description: 'Scan dependencies, prepare isolated fixes, and attach verification evidence to draft pull requests.'
author: 'tech49labs'
inputs:
  gemini_api_key:
    description: 'Optional Gemini API key; used only when enable_healing is true'
    required: false
    default: ''
  api_key:
    description: 'Legacy alias for a Gemini key only; not a commercial license'
    required: false
    default: ''
  enable_healing:
    description: 'Opt in to bounded source/diagnostic sharing and Gemini inference costs'
    required: false
    default: 'false'
  flash_model:
    description: 'Explicit Gemini stage 3 model; checked against the account model list'
    required: false
    default: ''
  pro_model:
    description: 'Distinct Gemini stage 4 escalation model; checked against the account model list'
    required: false
    default: ''
  test_cmd:
    description: 'Trusted custom test command, executed in the affected subproject'
    required: false
    default: ''
  dry_run:
    description: 'Scan and report only; findings exit 2. Set false to prepare draft PRs.'
    required: false
    default: 'true'
  github_token:
    description: 'Token with contents:write and pull-requests:write for draft delivery'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install verified scanner and GreenPR dependencies
      shell: bash
      env:
        GREENPR_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]] || { echo 'GreenPR action requires Linux x64'; exit 1; }
        scanner_dir="$RUNNER_TEMP/greenpr-tools"
        mkdir -p "$scanner_dir"
        curl --fail --silent --show-error --location --retry 3 \
          'https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64' \
          --output "$scanner_dir/osv-scanner"
        echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $scanner_dir/osv-scanner" | sha256sum --check -
        chmod +x "$scanner_dir/osv-scanner"
        echo "$scanner_dir" >> "$GITHUB_PATH"
        python -m pip install -r "$GREENPR_ACTION_PATH/requirements.txt"
    - name: Run isolated GreenPR engine
      shell: bash
      env:
        GREENPR_ACTION_PATH: ${{ github.action_path }}
        GREENPR_TEST_CMD: ${{ inputs.test_cmd }}
        GREENPR_DRY_RUN: ${{ inputs.dry_run }}
        GREENPR_ENABLE_HEALING: ${{ inputs.enable_healing }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key || inputs.api_key }}
        GREENPR_FLASH_MODEL: ${{ inputs.flash_model }}
        GREENPR_PRO_MODEL: ${{ inputs.pro_model }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash "$GREENPR_ACTION_PATH/scripts/action-run.sh"
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: greenpr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/greenpr-report-${{ github.run_id }}-${{ github.run_attempt }}.json
        if-no-files-found: warn
