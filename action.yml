name: 'GreenPR dependency updates'
description: 'Update a dependency and require your configured verification command to pass before publishing a pull request.'
author: 'GreenPR'

inputs:
  enable_model_repair:
    description: 'Allow source files and error traces to be sent to the configured model provider'
    required: false
    default: 'false'
  test_cmd:
    description: 'Custom command to run project test suite (e.g. pytest, npm test, cargo test). If omitted, automatically detected.'
    required: false
    default: ''
  api_key:
    description: 'GreenPR API Key (supports Gemini, Anthropic Claude, OpenAI, DeepSeek, Groq, or custom endpoints)'
    required: false
    default: ''
  gemini_api_key:
    description: 'Optional Google Gemini API key override'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Optional Anthropic API key override'
    required: false
    default: ''
  openai_api_key:
    description: 'Optional OpenAI API key override'
    required: false
    default: ''
  model:
    description: 'Optional explicit model name override'
    required: false
    default: ''
  github_token:
    description: 'GitHub token with contents:write and pull-requests:write permissions'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Initialize GreenPR Scanner Core
      shell: bash
      run: |
        command -v osv-scanner >/dev/null || { echo 'Install a reviewed OSV-Scanner version on the runner first.' >&2; exit 1; }
        python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Execute GreenPR Remediation Engine
      shell: bash
      env:
        GIT_AUTHOR_NAME: GreenPR
        GIT_COMMITTER_NAME: GreenPR
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GREENPR_API_KEY: ${{ inputs.api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GREENPR_TEST_CMD: ${{ inputs.test_cmd }}
        GREENPR_MODEL_REPAIR: ${{ inputs.enable_model_repair }}
        GREENPR_MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        args=()
        if [ -n "$GREENPR_TEST_CMD" ]; then
          args+=(--test-cmd "$GREENPR_TEST_CMD")
        fi
        if [ "$GREENPR_MODEL_REPAIR" = 'true' ]; then
          args+=(--enable-model-repair)
        fi
        python "$GITHUB_ACTION_PATH/remediate.py" "${args[@]}"
