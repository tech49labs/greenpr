name: 'GreenPR: Autonomous Zero-Hallucination Dependency Remediation'
description: 'Detects dependency security issues, patches breaking syntax, and guarantees 100% test pass (Exit Code 0) before opening Pull Requests.'
author: 'tech49labs'

inputs:
  test_cmd:
    description: 'Custom command to run project test suite (e.g. pytest, npm test, cargo test). If omitted, automatically detected.'
    required: false
    default: ''
  api_key:
    description: 'GreenPR API Key (supports Gemini, Anthropic Claude, OpenAI, DeepSeek, Groq, or custom endpoints)'
    required: false
    default: ''
  gemini_api_key:
    description: 'Optional Google Gemini API key override'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Optional Anthropic API key override'
    required: false
    default: ''
  openai_api_key:
    description: 'Optional OpenAI API key override'
    required: false
    default: ''
  model:
    description: 'Optional explicit model name override'
    required: false
    default: ''
  github_token:
    description: 'GitHub token with contents:write and pull-requests:write permissions'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Initialize GreenPR Scanner Core
      shell: bash
      run: |
        curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner > /dev/null 2>&1 || true
        chmod +x /usr/local/bin/osv-scanner > /dev/null 2>&1 || true
        pip install --quiet --upgrade pip
        pip install --quiet -r ${{ github.action_path }}/requirements.txt

    - name: Execute GreenPR Remediation Engine
      shell: bash
      env:
        GREENPR_API_KEY: ${{ inputs.api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key || inputs.api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key || inputs.api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key || inputs.api_key }}
        GREENPR_MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        TEST_ARG=""
        if [ -n "${{ inputs.test_cmd }}" ]; then
          TEST_ARG="--test-cmd \"${{ inputs.test_cmd }}\""
        fi
        python ${{ github.action_path }}/remediate.py $TEST_ARG
